<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" font-family="Inter, Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B5747"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="470" rx="12" fill="#FBFAF6" stroke="#E1DCCC"/>

  <!-- Frontend -->
  <rect x="330" y="28" width="260" height="76" rx="10" fill="#12192B"/>
  <text x="460" y="57" text-anchor="middle" font-size="15" font-weight="700" fill="#F7F5EF">Next.js 14 frontend</text>
  <text x="460" y="77" text-anchor="middle" font-size="12" fill="#E6C87C">Browser / PWA · port 3000</text>
  <text x="460" y="94" text-anchor="middle" font-size="11" fill="#B7BCCB">App Router · Tailwind · Socket.IO client</text>

  <!-- Firebase -->
  <rect x="40" y="190" width="200" height="76" rx="10" fill="#FFFFFF" stroke="#AB812E" stroke-width="2"/>
  <text x="140" y="223" text-anchor="middle" font-size="15" font-weight="700" fill="#12192B">Firebase Auth</text>
  <text x="140" y="244" text-anchor="middle" font-size="12" fill="#5B5747">issues ID tokens</text>

  <!-- API -->
  <rect x="330" y="180" width="260" height="96" rx="10" fill="#FFFFFF" stroke="#12192B" stroke-width="2"/>
  <text x="460" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#12192B">Express API + Socket.IO</text>
  <text x="460" y="233" text-anchor="middle" font-size="12" fill="#AB812E">port 4000</text>
  <text x="460" y="254" text-anchor="middle" font-size="11" fill="#5B5747">helmet · cors · rate limits · zod</text>

  <!-- Frontend <-> API -->
  <line x1="460" y1="104" x2="460" y2="180" stroke="#5B5747" stroke-width="2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <rect x="470" y="130" width="190" height="24" rx="4" fill="#FBFAF6"/>
  <text x="478" y="146" font-size="12" fill="#3B4361">REST /api/*  +  WebSocket</text>

  <!-- Frontend -> Firebase (sign-in) -->
  <path d="M330 66 H140 V190" fill="none" stroke="#5B5747" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="150" y="116" width="150" height="24" rx="4" fill="#FBFAF6"/>
  <text x="158" y="132" font-size="12" fill="#3B4361">sign-in (Firebase SDK)</text>

  <!-- Firebase -> API (verify) -->
  <line x1="240" y1="228" x2="330" y2="228" stroke="#5B5747" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="285" y="218" text-anchor="middle" font-size="11" fill="#3B4361">verify</text>

  <!-- API -> bus -> data stores -->
  <line x1="460" y1="276" x2="460" y2="332" stroke="#5B5747" stroke-width="2"/>
  <line x1="130" y1="332" x2="790" y2="332" stroke="#5B5747" stroke-width="2"/>
  <path d="M130 332 V362" stroke="#5B5747" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M350 332 V362" stroke="#5B5747" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M570 332 V362" stroke="#5B5747" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M790 332 V362" stroke="#5B5747" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Data stores -->
  <rect x="40" y="362" width="180" height="70" rx="10" fill="#12192B"/>
  <text x="130" y="392" text-anchor="middle" font-size="15" font-weight="700" fill="#F7F5EF">MongoDB</text>
  <text x="130" y="414" text-anchor="middle" font-size="12" fill="#E6C87C">all app data · required</text>

  <rect x="260" y="362" width="180" height="70" rx="10" fill="#FFFFFF" stroke="#8A91A8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="350" y="392" text-anchor="middle" font-size="15" font-weight="700" fill="#12192B">Redis</text>
  <text x="350" y="414" text-anchor="middle" font-size="12" fill="#5B5747">shared sockets · optional</text>

  <rect x="480" y="362" width="180" height="70" rx="10" fill="#FFFFFF" stroke="#8A91A8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="570" y="392" text-anchor="middle" font-size="15" font-weight="700" fill="#12192B">Cloudinary</text>
  <text x="570" y="414" text-anchor="middle" font-size="12" fill="#5B5747">image uploads · optional</text>

  <rect x="700" y="362" width="180" height="70" rx="10" fill="#FFFFFF" stroke="#8A91A8" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="790" y="392" text-anchor="middle" font-size="15" font-weight="700" fill="#12192B">SMTP · Web Push</text>
  <text x="790" y="414" text-anchor="middle" font-size="12" fill="#5B5747">email &amp; push · optional</text>

  <text x="460" y="456" text-anchor="middle" font-size="11" fill="#78735F">Solid boxes are required · dashed boxes are optional and the app works without them</text>
</svg>
